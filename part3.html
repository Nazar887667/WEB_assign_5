<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 3. Events</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Part 1</a>
    <a href="part2.html">Part 2</a>
    <a href="part3.html">Part 3</a>

  <main>
    <h1>Part 3. Events</h1>

    <section>
      <h2>Task 5. Mouse Events</h2>
      <div id="hoverBox">Hover over me</div>
    </section>

    <section>
      <h2>Task 6. Keyboard Events</h2>
      <input type="text" id="textInput" placeholder="Type something">
      <p>You typed: <span id="output"></span></p>
    </section>

    <section>
      <h2>Task 7. Calculator</h2>
      <input type="number" id="num1" placeholder="First number">
      <input type="number" id="num2" placeholder="Second number">
      <br>
      <button id="addBtn">+</button>
      <button id="subBtn">-</button>
      <button id="mulBtn">*</button>
      <button id="divBtn">/</button>
      <p>Result: <span id="result"></span></p>
    </section>
  </main>
  <script src="part3.js"></script>
